<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Cohete</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top left, #334155, transparent 40%),
                linear-gradient(135deg, #0f172a, #020617);

            color: white;
        }

        .card {
            width: 420px;
            padding: 35px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);

            position: relative;
            z-index: 2;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 27px;
        }

        .description {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #cbd5e1;
            font-size: 14px;
        }

      .input-container {
    position: relative;
    width: 100%;
    height: 52px;
    overflow: hidden;
}

        input {
            width: 100%;
            height: 52px;

            padding: 0 55px 0 15px;

            font-size: 18px;

            color: white;
            background: #0f172a;

            border: 1px solid #334155;
            border-radius: 12px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        #eyeButton {
            position: absolute;

            top: 6px;
            right: 6px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background: #1e293b;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s;

            z-index: 1000;
        }

        #eyeButton svg {
            width: 22px;
            height: 22px;

            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        #eyeButton:hover {
            background: #334155;
        }

        #eyeButton.ready {
            background: #0284c7;
        }

        #eyeButton.ready:hover {
            background: #0369a1;
            transform: scale(1.1);
        }

        /*
         * Fuego del cohete
         */
        #eyeButton.rocket::before,
        #eyeButton.rocket::after {
            content: "";

            position: absolute;

            width: 16px;
            height: 34px;

            left: 50%;
            bottom: -28px;

            transform: translateX(-50%);

            border-radius: 50% 50% 70% 70%;

            pointer-events: none;
        }

        #eyeButton.rocket::before {
            background:
                linear-gradient(
                    to bottom,
                    #fff7ed,
                    #facc15 30%,
                    #f97316 60%,
                    #ef4444
                );

            filter: blur(1px);

            animation: flame 0.12s infinite alternate;
        }

        #eyeButton.rocket::after {
            width: 9px;
            height: 24px;

            bottom: -21px;

            background:
                linear-gradient(
                    to bottom,
                    white,
                    #fde047,
                    #fb923c
                );

            animation: flameInner 0.1s infinite alternate;
        }

        @keyframes flame {
            from {
                transform:
                    translateX(-50%)
                    scaleY(0.8);

                opacity: 0.7;
            }

            to {
                transform:
                    translateX(-50%)
                    scaleY(1.4);

                opacity: 1;
            }
        }

        @keyframes flameInner {
            from {
                transform:
                    translateX(-50%)
                    scaleY(0.7);
            }

            to {
                transform:
                    translateX(-50%)
                    scaleY(1.3);
            }
        }

        /*
         * Partículas detrás del cohete
         */
        .particle {
            position: fixed;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #f97316;

            pointer-events: none;

            z-index: 999;

            animation: particleFade 0.7s ease-out forwards;
        }

        @keyframes particleFade {
            from {
                opacity: 1;
                transform: scale(1);
            }

            to {
                opacity: 0;
                transform:
                    translate(
                        var(--particle-x),
                        var(--particle-y)
                    )
                    scale(0);
            }
        }

        .message {
            min-height: 25px;

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            color: #38bdf8;
        }

        .counter {
            text-align: center;

            font-size: 12px;

            color: #64748b;

            margin-top: 5px;
        }

        .success {
            color: #4ade80;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🔐 Ingrese su contraseña</h2>

    <div class="description">
        Puede visualizar la contraseña utilizando el botón del ojo.
    </div>

    <label for="password">
        Contraseña
    </label>

    <div class="input-container">

        <input
            type="password"
            id="password"
            placeholder="Ingrese su contraseña"
            autocomplete="off"
        >

        <button
            type="button"
            id="eyeButton"
            aria-label="Mostrar contraseña"
        >

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="
                        M2.458 12
                        C3.732 7.943
                        7.523 5
                        12 5
                        c4.478 0
                        8.268 2.943
                        9.542 7
                        -1.274 4.057
                        -5.064 7
                        -9.542 7
                        -4.477 0
                        -8.268-2.943
                        -9.542-7z
                    "
                />

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                />
            </svg>

        </button>

    </div>

    <div
        class="message"
        id="message"
    ></div>

    <div
        class="counter"
        id="counter"
    ></div>

</div>

<script>
    const password = document.getElementById("password");
    const eyeButton = document.getElementById("eyeButton");
    const inputContainer = document.querySelector(".input-container");
    const message = document.getElementById("message");
    const counter = document.getElementById("counter");

    let escapeCount = 0;
    const maxEscapes = 3;

    let enabled = false;
    let flying = false;

    eyeButton.addEventListener("mouseenter", async () => {

        if (enabled || flying) {
            return;
        }

        flying = true;
        escapeCount++;

        showMessage();

        await moveInsideTextbox();

        if (escapeCount >= maxEscapes) {

            enabled = true;

            message.textContent =
                "😎 Bueno... ahora sí.";

            message.classList.add("success");

            counter.textContent =
                "Ahora podés hacer clic.";

            eyeButton.classList.add("ready");
        }

        flying = false;
    });


    function moveInsideTextbox() {

        return new Promise(resolve => {

            const containerWidth =
                inputContainer.clientWidth;

            const buttonWidth =
                eyeButton.offsetWidth;

            /*
             * Zona segura CENTRAL
             * dentro del textbox.
             *
             * No usamos todo el ancho.
             */
            const minX =
                containerWidth * 0.25;

            const maxX =
                containerWidth * 0.75
                - buttonWidth;

            /*
             * Posición actual.
             */
            const currentLeft =
                eyeButton.offsetLeft;


            let destinationX;


            /*
             * Intentamos conseguir un destino
             * suficientemente alejado del actual,
             * pero siempre dentro del textbox.
             */
            do {

                destinationX =
                    minX +
                    Math.random() *
                    (maxX - minX);

            } while (
                Math.abs(destinationX - currentLeft) < 60
            );


            /*
             * El botón siempre queda
             * verticalmente centrado.
             */
            const destinationY =
                (
                    inputContainer.clientHeight -
                    eyeButton.offsetHeight
                ) / 2;


            eyeButton.style.right = "auto";

            eyeButton.classList.add("rocket");


            const animation =
                eyeButton.animate(
                    [
                        {
                            left:
                                currentLeft + "px",

                            top:
                                eyeButton.offsetTop + "px",

                            transform:
                                "translateY(0) scale(1) rotate(0deg)"
                        },

                        {
                            left:
                                (
                                    currentLeft +
                                    destinationX
                                ) / 2 + "px",

                            top:
                                destinationY - 12 + "px",

                            transform:
                                "translateY(-4px) scale(1.18) rotate(20deg)"
                        },

                        {
                            left:
                                destinationX + "px",

                            top:
                                destinationY + "px",

                            transform:
                                "translateY(0) scale(1) rotate(0deg)"
                        }
                    ],
                    {
                        duration: 420,
                        easing:
                            "cubic-bezier(.22,.61,.36,1)",
                        fill: "forwards"
                    }
                );


            const particleInterval =
                setInterval(() => {

                    createParticles();

                }, 50);


            animation.onfinish = () => {

                clearInterval(
                    particleInterval
                );

                eyeButton.style.left =
                    destinationX + "px";

                eyeButton.style.top =
                    destinationY + "px";

                eyeButton.style.transform =
                    "none";

                eyeButton.classList.remove(
                    "rocket"
                );

                resolve();
            };
        });
    }


    function createParticles() {

        const rect =
            eyeButton.getBoundingClientRect();

        for (let i = 0; i < 2; i++) {

            const particle =
                document.createElement("div");

            particle.className =
                "particle";

            particle.style.left =
                (
                    rect.left +
                    rect.width / 2
                ) + "px";

            particle.style.top =
                (
                    rect.top +
                    rect.height / 2
                ) + "px";

            const randomX =
                Math.random() * 30 - 15;

            const randomY =
                Math.random() * 25 + 10;

            particle.style.setProperty(
                "--particle-x",
                randomX + "px"
            );

            particle.style.setProperty(
                "--particle-y",
                randomY + "px"
            );

            document.body.appendChild(
                particle
            );

            setTimeout(() => {
                particle.remove();
            }, 500);
        }
    }


    function showMessage() {

        switch (escapeCount) {

            case 1:
                message.textContent =
                    "🚀 ¡Casi!";
                counter.textContent =
                    "Te quedan 2 intentos.";
                break;

            case 2:
                message.textContent =
                    "😂 ¡Otra vez!";
                counter.textContent =
                    "Te queda 1 intento.";
                break;

            case 3:
                message.textContent =
                    "🚀💨 ¡Última escapada!";
                counter.textContent =
                    "";
                break;
        }
    }


    eyeButton.addEventListener(
        "click",
        function () {

            if (!enabled) {
                return;
            }

            if (password.type === "password") {

                password.type = "text";

                message.textContent =
                    "👀 Contraseña visible";

            } else {

                password.type =
                    "password";

                message.textContent =
                    "🔐 Contraseña oculta";
            }
        }
    );
</script>
</body>
</html>
